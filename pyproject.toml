[project]
name = "quotalens"
version = "0.1.0"
description = "QuotaLens: local, self-hosted monitor for Claude subscription quota, with burn rate and history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Amit Sharma" }]
keywords = ["claude", "usage", "quota", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "curl_cffi>=0.10",
    "keyring>=25",
]

[project.optional-dependencies]
# What the test suite needs on top of the app itself. httpx is here because
# starlette's TestClient imports an HTTP client at module scope; nothing that
# ships in the wheel uses it. CI installs the wheel with this extra so the
# dependency list has exactly one home.
test = [
    "pytest>=8",
    "httpx>=0.27",
]
dev = [
    "quotalens[test]",
    "ruff==0.16.*",  # same pin the lint job uses; a floating ruff reformats on upgrade
]

[project.scripts]
quotalens = "quotalens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotalens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RUF"]
ignore = ["RUF012", "RUF001"]  # RUF001: UI strings use en dashes and the multiplication sign on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
