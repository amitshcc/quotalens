[project]
name = "quotalens"
version = "0.1.0.dev0"
description = "QuotaLens: local, self-hosted monitor for Claude subscription quota, with burn rate and history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Amit Sharma" }]
keywords = ["claude", "usage", "quota", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "curl_cffi>=0.10",
    "keyring>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
quotalens = "quotalens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotalens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
