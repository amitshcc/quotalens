name: CI

# Cross-platform is a headline claim in the README. Until this is green on all
# three runners it stays a claim, and the README says "Windows untested".

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.*"
      - run: ruff check src tests qa
      - run: ruff format --check src tests qa

  # Whether the favicon draws, and what size a cell computes to, are questions
  # about SVG and CSS rather than about the operating system, so they run once
  # rather than on all six matrix jobs. A separate job because these are the only
  # things here that need a browser.
  render:
    name: what a browser actually renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_favicon_render.py tests/test_rendered_type.py -q

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # a Windows failure must not hide a Linux one
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # Installing the wheel rather than the source tree is the point: it is what
      # a user gets from pipx, and it catches anything missing from the package
      # data (the stylesheet, the scripts, the favicon).
      - name: Install from the wheel
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[test]"

      - name: Unit tests
        run: python -m pytest -q

      # The tests mock every HTTP call, so nothing above proves the process can
      # actually start, poll, write rows and serve them on this platform.
      - name: Smoke (server against a fake upstream, then the CLI lifecycle)
        run: python qa/smoke.py

      # Registering a scheduled task is the one thing unit tests cannot prove: the
      # XML either satisfies Task Scheduler's schema or it does not, and only
      # Windows can say. Install for real, confirm the task exists, then remove it.
      # pwsh, not bash: Git Bash rewrites a leading-slash argument into a path, so
      # `schtasks /Query` would arrive as `schtasks C:/Program Files/Git/Query`.
      - name: Auto-start at login registers and unregisters (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "svc"
          python -m quotalens --data-dir $data service install --interval 300
          if ($LASTEXITCODE -ne 0) { throw "service install failed" }
          schtasks /Query /TN QuotaLens
          if ($LASTEXITCODE -ne 0) { throw "install reported success but no task was registered" }
          python -m quotalens --data-dir $data service status
          python -m quotalens --data-dir $data service uninstall
          if ($LASTEXITCODE -ne 0) { throw "service uninstall failed" }
          schtasks /Query /TN QuotaLens 2>$null
          if ($LASTEXITCODE -eq 0) { throw "the task survived uninstall" }
          Write-Host "registered, queried and removed"
          exit 0  # the query above is meant to fail; without this the step inherits its code

      - name: Package contents
        shell: bash
        run: |
          python - <<'PY'
          from importlib import resources
          for name in ("tokens.css", "app.css", "app.js", "chart.js", "favicon.svg"):
              data = resources.files("quotalens.web").joinpath(name).read_bytes()
              assert data, name
              print(f"{name}: {len(data)} bytes")
          PY
